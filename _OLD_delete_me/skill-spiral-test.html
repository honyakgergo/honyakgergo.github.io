<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Skill Spiral — test</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;1,14..32,300;1,14..32,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#0b0c0e; --paper-2:#16181c; --ink:#f2f2f5; --ink-2:#c7c9d1;
    --ink-mute:#8a8d97; --ink-faint:#5f636d; --blue:#5b93ff;
    --rule:rgba(255,255,255,.12); --rule-soft:rgba(255,255,255,.06);
    --serif:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-weight:300;-webkit-font-smoothing:antialiased;}

  .spiral{position:relative;height:340vh;background:var(--paper);}
  .stage-wrap{position:sticky;top:0;height:100vh;overflow:hidden;}
  .stage{position:absolute;inset:0;perspective:1150px;background:radial-gradient(ellipse 70% 55% at 50% 46%, rgba(91,147,255,.07), transparent 62%);}
  .helix{position:absolute;left:50%;top:50%;transform-style:preserve-3d;}

  .tile{
    position:absolute; left:-150px; top:-180px; width:300px; height:360px;
    background:var(--paper-2); border:2px solid var(--rule); border-radius:32px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px;
    box-shadow:0 44px 90px -50px rgba(0,0,0,.85); backface-visibility:hidden;
  }
  .tile .ic{width:120px;height:120px;display:flex;align-items:center;justify-content:center;}
  .tile .ic img{width:100%;height:100%;display:block;}
  .tile .nm{font-family:var(--mono);font-size:23px;letter-spacing:.04em;color:var(--ink-2);white-space:nowrap;}
  .tile.focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(91,147,255,.45),0 40px 110px -34px rgba(91,147,255,.5),0 30px 80px -48px rgba(0,0,0,.9);}
  .tile.focus .nm{color:var(--blue);}

  /* overlays */
  .hud{position:absolute;inset:0;pointer-events:none;z-index:30;}
  .head{position:absolute;top:clamp(28px,5vh,60px);left:clamp(24px,5vw,72px);max-width:min(460px,78vw);}
  .kick{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:16px;}
  h1{font-family:var(--serif);font-weight:300;font-size:clamp(34px,5vw,64px);line-height:.98;letter-spacing:-.025em;}
  h1 em{font-style:italic;color:var(--blue);}
  .sub{margin-top:16px;font-size:clamp(14px,1.2vw,17px);line-height:1.5;color:var(--ink-2);max-width:40ch;}

  .readout{position:absolute;left:clamp(24px,5vw,72px);bottom:clamp(30px,7vh,90px);}
  .readout .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;}
  .readout .val{font-family:var(--serif);font-weight:300;font-size:clamp(30px,4vw,56px);letter-spacing:-.02em;color:var(--ink);transition:opacity .25s ease;line-height:1;}
  .readout .val em{font-style:italic;color:var(--blue);}
  .hint{position:absolute;right:clamp(24px,5vw,72px);bottom:clamp(30px,7vh,90px);font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);text-align:right;}

  .after{height:120vh;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);border-top:1px solid var(--rule-soft);}
  @media (max-width:820px){ .tile{width:236px;height:292px;left:-118px;top:-146px;} }
</style>
</head>
<body>

<section class="spiral" id="spiral">
  <div class="stage-wrap">
    <div class="stage">
      <div class="helix" id="helix"></div>
    </div>
    <div class="hud">
      <div class="head">
        <div class="kick">A working vocabulary</div>
        <h1>The stack,<br><em>in orbit.</em></h1>
        <p class="sub">Sixteen tools I actually reach for, turning through focus. Scroll to spin the toolkit.</p>
      </div>
      <div class="readout">
        <div class="lbl">In focus</div>
        <div class="val" id="focusName">Python</div>
      </div>
      <div class="hint">scroll to spin</div>
    </div>
  </div>
</section>
<div class="after">demo &middot; the section below would continue here</div>

<script>
(function(){
  "use strict";
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

  const CDN="https://cdn.simpleicons.org/";
  const AZURE="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/azure/azure-original.svg";
  const STACK=[
    {name:"Python",slug:"python"},{name:"pandas",slug:"pandas"},{name:"PyTorch",slug:"pytorch"},
    {name:"scikit-learn",slug:"scikitlearn"},{name:"Hugging Face",slug:"huggingface"},{name:"TensorFlow",slug:"tensorflow"},
    {name:"FastAPI",slug:"fastapi"},{name:"React",slug:"react"},{name:"Streamlit",slug:"streamlit"},
    {name:"Docker",slug:"docker"},{name:"GCP",slug:"googlecloud"},{name:"Azure",icon:AZURE},
    {name:"Airflow",slug:"apacheairflow"},{name:"MLflow",slug:"mlflow"},{name:"Git",slug:"git"},
    {name:"Postgres",slug:"postgresql"},
  ];
  const N=STACK.length;

  const MONO="brightness(0) saturate(100%)";
  const BLUE="brightness(0) saturate(100%) invert(42%) sepia(93%) saturate(1352%) hue-rotate(199deg) brightness(97%) contrast(96%)";

  const helix=document.getElementById("helix");
  const focusName=document.getElementById("focusName");
  const section=document.getElementById("spiral");
  const tiles=STACK.map(function(s){
    const el=document.createElement("div"); el.className="tile";
    const src=s.icon||(CDN+s.slug);
    el.innerHTML='<span class="ic"><img src="'+src+'" alt="" loading="lazy"/></span><span class="nm">'+s.name+'</span>';
    helix.appendChild(el);
    return {el:el, img:el.querySelector("img"), name:s.name};
  });

  /* ---------- geometry / feel (tune these) ---------- */
  const R=300, STEP_ANGLE=40, STEP_Y=126, IDLE=0.12, SCROLL_SPAN=N;
  let curFocus=-1, t0=performance.now();

  function frame(now){
    const t=(now-t0)/1000;
    const rect=section.getBoundingClientRect();
    const total=rect.height-innerHeight;
    const frac= total>0 ? clamp(-rect.top/total,0,1) : 0;
    const progress = (reduce?0:t*IDLE) + frac*SCROLL_SPAN;

    let bestRel=1e9, bestIdx=0;
    for(let i=0;i<N;i++){
      // wrapped relative position so the spiral loops endlessly
      let rel=((i-progress)%N+N)%N; if(rel>N/2) rel-=N;
      const a=rel*STEP_ANGLE, y=rel*STEP_Y, af=Math.abs(rel);
      const scale=clamp(1.18-af*0.12,0.6,1.18);
      const op=clamp(1.06-af*0.26,0.04,1);
      const blur=af<0.9?0:Math.min((af-0.9)*3,10);
      const T=tiles[i];
      T.el.style.transform="translateY("+y+"px) rotateY("+a+"deg) translateZ("+R+"px) scale("+(scale*0.5)+")";
      T.el.style.opacity=op;
      T.el.style.filter=blur>0.3?("blur("+blur+"px)"):"none";
      const focused=af<0.55;
      T.el.classList.toggle("focus",focused);
      T.img.style.filter=focused?"none":"saturate(.45) brightness(1.25)";
      T.img.style.opacity=focused?1:0.7;
      if(af<bestRel){bestRel=af;bestIdx=i;}
    }
    if(bestIdx!==curFocus){
      curFocus=bestIdx;
      focusName.style.opacity=0;
      setTimeout(function(){ focusName.textContent=tiles[bestIdx].name; focusName.style.opacity=1; },140);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
